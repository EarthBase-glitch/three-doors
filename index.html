<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Work+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@500;600&display=swap');

  :root{
    --void:#07060b;
    --void-2:#0d0a17;
    --void-3:#150f24;
    --ink:#ece7f7;
    --ink-dim:#a89bc4;
    --ink-faint:#5f5578;
    --threshold:#8d6fe0;
    --threshold-glow:#c9b6ff;
    --heaven:#bfeaff;
    --heaven-glow:#eef9ff;
    --heaven-deep:#173447;
    --earth:#7fc26a;
    --earth-glow:#c7f0b8;
    --earth-deep:#1c3117;
    --hell:#ff6a3d;
    --hell-glow:#ffb488;
    --hell-deep:#43110b;
    --hairline: rgba(236,231,247,0.12);
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:var(--void);
    color:var(--ink);
    overflow:hidden;
    font-family:'Work Sans',ui-sans-serif,system-ui,sans-serif;
  }
  #root{ position:relative; width:100%; height:100%; background:var(--void); }

  .stars{
    position:absolute;
    inset:0;
    pointer-events:none;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 22%, rgba(236,231,247,0.55), transparent 60%),
      radial-gradient(1px 1px at 27% 68%, rgba(236,231,247,0.4), transparent 60%),
      radial-gradient(1.5px 1.5px at 41% 12%, rgba(236,231,247,0.5), transparent 60%),
      radial-gradient(1px 1px at 58% 78%, rgba(236,231,247,0.35), transparent 60%),
      radial-gradient(1.5px 1.5px at 73% 34%, rgba(236,231,247,0.5), transparent 60%),
      radial-gradient(1px 1px at 84% 60%, rgba(236,231,247,0.4), transparent 60%),
      radial-gradient(1.5px 1.5px at 92% 15%, rgba(236,231,247,0.5), transparent 60%),
      radial-gradient(1px 1px at 6% 85%, rgba(236,231,247,0.35), transparent 60%),
      radial-gradient(1.5px 1.5px at 65% 92%, rgba(236,231,247,0.45), transparent 60%);
    opacity:0.8;
  }

  .account-badge{
    position:fixed; top:14px; right:16px; z-index:5;
    display:flex; align-items:center; gap:8px;
    font-family:'JetBrains Mono',ui-monospace,monospace;
    font-size:0.7rem; color:var(--ink-faint);
    background:rgba(13,10,23,0.65);
    padding:7px 13px; border-radius:999px; border:1px solid var(--hairline);
    opacity:0; transform:translateY(-6px);
    transition:opacity 500ms ease, transform 500ms ease, visibility 0s linear 500ms;
    visibility:hidden;
  }
  .account-badge.show{ opacity:1; transform:translateY(0); visibility:visible; transition:opacity 500ms ease, transform 500ms ease; }
  .account-badge .name{ color:var(--ink-dim); }
  .link-btn{ background:none; border:none; color:var(--ink-dim); text-decoration:underline; cursor:pointer; font:inherit; padding:0; }
  .link-btn:hover{ color:var(--ink); }

  .sound-toggle{
    position:fixed; top:14px; left:16px; z-index:5;
    font-family:'JetBrains Mono',ui-monospace,monospace;
    font-size:0.7rem; color:var(--ink-faint);
    background:rgba(13,10,23,0.65);
    padding:7px 13px; border-radius:999px; border:1px solid var(--hairline);
    cursor:pointer;
    opacity:0; transform:translateY(-6px);
    transition:opacity 500ms ease, transform 500ms ease, visibility 0s linear 500ms, color 160ms ease, border-color 160ms ease;
    visibility:hidden;
  }
  .sound-toggle.show{
    opacity:1; transform:translateY(0); visibility:visible;
    transition:opacity 500ms ease, transform 500ms ease, color 160ms ease, border-color 160ms ease;
  }
  .sound-toggle:hover{ color:var(--ink); border-color:var(--threshold-glow); }
  .sound-toggle:focus-visible{ outline:2px solid var(--threshold-glow); outline-offset:2px; }

  .realm-stats{
    position:fixed; top:14px; left:50%; transform:translate(-50%,-6px);
    z-index:5; display:flex; flex-direction:column; align-items:center; gap:6px;
    max-width:min(92vw,560px);
    opacity:0; visibility:hidden;
    transition:opacity 500ms ease, transform 500ms ease, visibility 0s linear 500ms;
  }
  .realm-stats.show{
    opacity:1; visibility:visible; transform:translate(-50%,0);
    transition:opacity 500ms ease, transform 500ms ease;
  }
  .realm-stats-you{
    font-family:'JetBrains Mono',ui-monospace,monospace; font-size:0.7rem; color:var(--ink-dim);
    background:rgba(13,10,23,0.65); border:1px solid var(--hairline); border-radius:999px;
    padding:6px 14px; text-align:center;
  }
  .realm-stats-you .n{ color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums; }
  .realm-stats-row{
    display:flex; flex-wrap:wrap; justify-content:center; gap:8px;
    font-family:'JetBrains Mono',ui-monospace,monospace; font-size:0.66rem; color:var(--ink-faint);
    background:rgba(13,10,23,0.5); border:1px solid var(--hairline); border-radius:999px; padding:5px 12px;
  }
  .realm-stat{ display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
  .realm-stat .n{ color:var(--ink-dim); font-variant-numeric:tabular-nums; }
  .realm-stat-dot{ width:6px; height:6px; border-radius:50%; display:inline-block; }

  .threshold{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:clamp(20px,4vh,40px); text-align:center; padding:24px;
    transition:opacity 900ms ease, transform 900ms ease, visibility 0s linear 900ms;
  }
  .threshold.leaving{ opacity:0; transform:scale(1.06); visibility:hidden; }
  .resuming{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity 300ms ease; }
  .resuming.active{ opacity:1; pointer-events:auto; }
  .resuming .q-eyebrow{ text-align:center; }
  .resuming .btn-en{ display:block; }
  .resuming .btn-sub{ display:block; margin-top:4px; opacity:0.7; font-size:0.85em; letter-spacing:normal; text-transform:none; }
  .threshold-art{ width:min(78vw,520px); aspect-ratio:1094/661; border-radius:18px; overflow:hidden;
    box-shadow:0 0 120px -10px rgba(141,111,224,0.45), 0 0 260px -40px rgba(255,106,61,0.25); }
  .threshold-art img{ display:block; width:100%; height:100%; object-fit:cover; }
  .threshold h1{ margin:0; font-family:'Cinzel',serif; font-weight:600; letter-spacing:0.08em;
    font-size:clamp(1.4rem,3.4vw,2.1rem); color:var(--ink); text-wrap:balance; }
  .threshold p{ margin:0; max-width:46ch; color:var(--ink-dim); font-size:clamp(0.95rem,1.6vw,1.05rem); line-height:1.6; }
  .threshold-note{
    margin:0; max-width:44ch; color:var(--ink-faint); font-size:0.8rem; font-style:italic;
  }
  .threshold-legal{ margin-top:4px; font-size:0.72rem; color:var(--ink-faint); }
  .threshold-legal a{ color:var(--ink-faint); text-decoration:underline; }
  .threshold-legal a:hover{ color:var(--ink-dim); }
  .enter-btn{
    appearance:none; border:1px solid var(--threshold-glow); background:rgba(141,111,224,0.12); color:var(--ink);
    font-family:'Work Sans',sans-serif; font-size:0.95rem; letter-spacing:0.04em;
    padding:0.85em 2.2em; border-radius:999px; cursor:pointer;
    transition:background 200ms ease, box-shadow 200ms ease, transform 200ms ease, opacity 200ms ease;
  }
  .enter-btn:hover, .enter-btn:focus-visible{ background:rgba(141,111,224,0.24); box-shadow:0 0 34px rgba(201,182,255,0.35); transform:translateY(-1px); }
  .enter-btn:focus-visible{ outline:2px solid var(--threshold-glow); outline-offset:3px; }
  .enter-btn:disabled{ opacity:0.5; cursor:default; transform:none; box-shadow:none; }

  .signinwrap{ position:absolute; inset:0; opacity:0; transform:scale(0.97); pointer-events:none;
    transition:opacity 900ms ease 200ms, transform 900ms ease 200ms;
    display:flex; align-items:center; justify-content:center; padding:20px; }
  .signinwrap.active{ opacity:1; transform:scale(1); pointer-events:auto; }
  .signin-panel{
    width:min(92vw,420px); border-radius:26px; padding:clamp(26px,5vw,44px);
    background: radial-gradient(120% 140% at 50% -10%, var(--threshold-glow) 0%, transparent 55%), linear-gradient(180deg, var(--void-2), var(--void));
    box-shadow: inset 0 0 0 1px var(--hairline), 0 40px 100px -30px rgba(0,0,0,0.8), 0 0 140px -50px var(--threshold);
  }
  .signin-status{ margin-top:16px; padding:12px 16px; border-radius:14px; background:rgba(255,255,255,0.04); border:1px solid var(--hairline); color:var(--ink-dim); font-size:0.88rem; }
  .signin-status .btn-sub{ display:block; font-size:0.8em; opacity:0.72; margin-top:2px; }
  .signin-tabs{ display:flex; gap:6px; margin-top:18px; }
  .signin-tab{
    flex:1; appearance:none; background:var(--void-3); border:1px solid var(--hairline); color:var(--ink-dim);
    font-family:'JetBrains Mono',ui-monospace,monospace; font-size:0.68rem; letter-spacing:0.08em; text-transform:uppercase;
    padding:0.65em 0.4em; border-radius:10px; cursor:pointer;
    transition:background 160ms ease, color 160ms ease, border-color 160ms ease;
  }
  .signin-tab:hover{ color:var(--ink); }
  .signin-tab.active{ background:var(--threshold); color:#0b0810; border-color:var(--threshold); font-weight:600; }
  .signin-tab:focus-visible{ outline:2px solid var(--threshold-glow); outline-offset:2px; }
  .field{ display:flex; flex-direction:column; gap:6px; margin-top:16px; }
  .field label{ font-family:'JetBrains Mono',ui-monospace,monospace; font-size:0.65rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-faint); }
  .field input{ background:var(--void-3); border:1px solid var(--hairline); border-radius:10px; padding:0.7em 0.9em; color:var(--ink); font-family:'Work Sans',sans-serif; font-size:0.95rem; }
  .field input:focus-visible{ outline:2px solid var(--threshold-glow); outline-offset:1px; border-color:var(--threshold-glow); }
  .signin-note{ margin-top:16px; font-size:0.76rem; color:var(--ink-faint); line-height:1.55; }
  .signin-error{ margin-top:10px; font-size:0.8rem; color:var(--hell-glow); min-height:1.2em; }
  .signin-actions{ margin-top:22px; }

  .hall{ position:absolute; inset:0; opacity:0; transform:scale(0.97); pointer-events:none;
    transition:opacity 900ms ease 200ms, transform 900ms ease 200ms; display:flex; flex-direction:column; }
  .hall.active{ opacity:1; transform:scale(1); pointer-events:auto; }
  .hall-header{ text-align:center; padding:clamp(14px,2.6vh,26px) 16px clamp(6px,1.4vh,14px); flex:0 0 auto; }
  .hall-header .kicker{ font-family:'JetBrains Mono',ui-monospace,monospace; font-size:0.68rem; letter-spacing:0.22em; text-transform:uppercase; color:var(--ink-faint); }
  .hall-header h2{ margin:0.35em 0 0; font-family:'Cinzel',serif; font-weight:500; font-size:clamp(1rem,2.2vw,1.3rem); color:var(--ink-dim); letter-spacing:0.03em; text-wrap:balance; }

  .doors{ flex:1 1 auto; display:flex; min-height:0; }
  .door-well{ position:relative; flex:1 1 0; display:flex; align-items:center; justify-content:center; padding:clamp(10px,2vh,26px) clamp(10px,2vw,22px); border-left:1px solid var(--hairline); }
  .door-well:first-child{ border-left:none; }

  .door{
    position:relative; width:min(100%,320px); height:min(70vh,560px);
    border-radius:130px 130px 10px 10px; cursor:pointer; border:none; padding:0;
    font:inherit; color:inherit; background:none;
    transition:transform 260ms ease, opacity 260ms ease, filter 260ms ease;
  }
  .door:hover{ transform:translateY(-4px); }
  .door:focus-visible{ outline:2px solid var(--ink); outline-offset:6px; border-radius:130px 130px 10px 10px; }
  .door:disabled{ cursor:default; transform:none; opacity:0.4; filter:grayscale(0.4); }
  .door:disabled:hover{ transform:none; }

  .door-frame{ position:absolute; inset:0; border-radius:130px 130px 10px 10px;
    background:linear-gradient(180deg, var(--void-3), var(--void-2));
    box-shadow: inset 0 0 0 1px var(--hairline), 0 30px 60px -30px rgba(0,0,0,0.7); overflow:hidden; }
  .door-glow{ position:absolute; inset:0; opacity:0.35; transition:opacity 420ms ease;
    background:radial-gradient(120% 90% at 50% 15%, var(--glow-color,var(--threshold)) 0%, transparent 65%); }
  .door:hover .door-glow, .door.chosen .door-glow{ opacity:0.6; }

  .door-leaf{
    position:absolute; inset:8px; border-radius:122px 122px 6px 6px;
    background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0) 30%), linear-gradient(180deg, var(--leaf-color, #1a1526), var(--leaf-color-2, #100c1a));
    box-shadow:inset 0 0 0 1px rgba(255,255,255,0.06);
    transform-origin:left center; transform:rotateY(0deg);
    transition:transform 900ms cubic-bezier(.2,.7,.2,1), box-shadow 420ms ease;
  }
  .door.chosen .door-leaf{ transform:rotateY(-72deg); box-shadow:40px 0 60px -20px rgba(0,0,0,0.6); }
  .door-leaf .panel{ position:absolute; inset:22px; border-radius:110px 110px 4px 4px; box-shadow:inset 0 0 0 1px rgba(255,255,255,0.05); }
  .door-leaf .panel::before, .door-leaf .panel::after{ content:""; position:absolute; left:16px; right:16px; height:38%; border-radius:90px 90px 4px 4px; box-shadow:inset 0 0 0 1px rgba(255,255,255,0.05); }
  .door-leaf .panel::before{ top:8%; }
  .door-leaf .panel::after{ bottom:8%; }
  .door-handle{ position:absolute; right:26px; top:52%; width:10px; height:10px; border-radius:50%; background:var(--glow-color,var(--threshold)); box-shadow:0 0 12px 2px var(--glow-color,var(--threshold)); }

  .door-label{ position:absolute; left:0; right:0; bottom:34px; text-align:center; font-family:'Cinzel',serif; font-weight:600; letter-spacing:0.14em; font-size:clamp(1rem,1.8vw,1.25rem); color:var(--glow-color,var(--ink)); text-transform:uppercase; text-shadow:0 0 18px rgba(0,0,0,0.6); z-index:2; }
  .door-sub{ position:absolute; left:8px; right:8px; bottom:14px; text-align:center; font-size:0.62rem; color:var(--ink-faint); letter-spacing:0.01em; z-index:2; line-height:1.4; }

  .door-interior{ position:absolute; inset:8px; border-radius:122px 122px 6px 6px; display:flex; align-items:flex-end; justify-content:center; padding-bottom:34px;
    background:radial-gradient(120% 100% at 50% 100%, var(--deep-color,#111) 0%, #05040a 78%); opacity:0; transition:opacity 500ms ease 260ms; }
  .door.chosen .door-interior{ opacity:1; }

  .tally{ display:flex; flex-direction:column; align-items:center; gap:2px; }
  .tally .count{ font-family:'JetBrains Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; font-size:clamp(1.6rem,3vw,2.1rem); font-weight:600; color:var(--glow-color,var(--ink)); text-shadow:0 0 22px var(--glow-color,transparent); }
  .tally .label{ font-size:0.68rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-dim); }

  .door[data-key="heaven"]{ --glow-color:var(--heaven); --leaf-color:#1c2a36; --leaf-color-2:#101a22; --deep-color:var(--heaven-deep); }
  .door[data-key="earth"]{ --glow-color:var(--earth); --leaf-color:#1c2818; --leaf-color-2:#121b0e; --deep-color:var(--earth-deep); }
  .door[data-key="hell"]{ --glow-color:var(--hell); --leaf-color:#2c1712; --leaf-color-2:#190c09; --deep-color:var(--hell-deep); }

  .hall-footer{ flex:0 0 auto; display:flex; align-items:center; justify-content:center; gap:8px;
    padding:clamp(10px,2vh,20px) 16px clamp(16px,3vh,26px); font-family:'JetBrains Mono',ui-monospace,monospace; font-size:0.78rem; color:var(--ink-dim); flex-wrap:wrap; text-align:center; }
  .hall-footer .n{ color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums; }
  .hall-footer .offline{ color:var(--hell-glow); }

  @media (max-width:760px){
    .doors{ flex-direction:column; }
    .door-well{ border-left:none; border-top:1px solid var(--hairline); padding:8px 16px; }
    .door-well:first-child{ border-top:none; }
    .door{ height:min(26vh,220px); width:min(90%,420px); border-radius:0; }
    .door-frame, .door-leaf, .door-interior{ border-radius:16px; }
    .door-leaf{ transform-origin:top center; }
    .door.chosen .door-leaf{ transform:rotateX(-70deg); }
    .door-label{ bottom:auto; top:14px; }
    .door-sub{ bottom:auto; top:38px; }
    .door-interior{ align-items:center; padding-bottom:0; }
  }

  .gamewrap{ position:absolute; inset:0; opacity:0; transform:scale(0.97); pointer-events:none;
    transition:opacity 900ms ease 200ms, transform 900ms ease 200ms; display:flex; align-items:center; justify-content:center; padding:20px; }
  .gamewrap.active{ opacity:1; transform:scale(1); pointer-events:auto; }
  .game-panel{
    position:relative; width:min(94vw,720px); max-height:92vh; overflow-y:auto; border-radius:28px; padding:clamp(26px,4vw,52px);
    background: radial-gradient(120% 140% at 50% -10%, var(--realm-glow) 0%, transparent 55%), linear-gradient(180deg, var(--void-2), var(--void));
    box-shadow: inset 0 0 0 1px var(--hairline), 0 40px 100px -30px rgba(0,0,0,0.8), 0 0 140px -50px var(--realm-color);
  }

  .q-eyebrow, .field-label{ font-family:'JetBrains Mono',ui-monospace,monospace; font-size:0.68rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--realm-color, var(--ink-faint)); }
  .q-heading{ margin:0.5em 0 0; font-family:'Cinzel',serif; font-weight:600; font-size:clamp(1.3rem,3vw,1.8rem); color:var(--ink); text-wrap:balance; }
  .q-tagline{ margin:0.7em 0 0; color:var(--ink-dim); font-style:italic; font-size:0.95rem; max-width:44ch; }

  .i18n-sub{ margin:0.35em 0 0; color:var(--ink-dim); font-size:0.86rem; max-width:46ch; line-height:1.6; letter-spacing:normal; }
  button.bi{ display:flex; flex-direction:column; gap:2px; line-height:1.25; }
  button.bi .btn-en{ display:block; }
  button.bi .btn-sub{ display:block; font-size:0.72em; opacity:0.72; font-weight:400; }
  .q-actions{ display:flex; flex-direction:column; align-items:stretch; gap:12px; margin-top:30px; max-width:380px; }
  .q-btn{ appearance:none; font-family:'Work Sans',sans-serif; font-size:0.92rem; padding:0.85em 1.4em; border-radius:999px; cursor:pointer; text-align:center; transition:transform 180ms ease, box-shadow 180ms ease, background 180ms ease; }
  .q-btn:hover{ transform:translateY(-1px); }
  .q-btn:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }
  .q-btn:disabled{ opacity:0.5; cursor:default; transform:none; }
  .q-btn.primary{ background:var(--realm-color); color:#0b0810; font-weight:600; border:none; box-shadow:0 0 30px -8px var(--realm-color); }
  .q-btn.ghost{ background:rgba(255,255,255,0.03); color:var(--ink-dim); border:1px solid var(--hairline); }
  .q-btn.ghost:hover{ border-color:var(--realm-color); color:var(--ink); }
  .q-btn.exit{ background:none; border:none; color:var(--ink-faint); text-decoration:underline; padding:0.4em 0; margin-top:6px; font-size:0.82rem; }
  .q-btn.tiny{ width:auto; padding:0.4em 1em; font-size:0.78rem; }
  .q-btn.tiny.bi .btn-sub{ font-size:0.68em; }

  .char-tip-label{ font-size:0.78rem; color:var(--ink-faint); align-self:center; }
  .char-manage-status{ margin:6px 0 0; font-size:0.8rem; color:var(--ink-faint); }

  .char-layout{ display:flex; gap:clamp(20px,4vw,44px); align-items:flex-start; flex-wrap:wrap; margin-top:28px; }
  .char-preview{ flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:12px; }
  .char-avatar{ width:150px; height:210px; }
  .char-chip{ font-family:'JetBrains Mono',ui-monospace,monospace; font-size:0.68rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-dim); border:1px solid var(--hairline); padding:0.3em 0.9em; border-radius:999px; }
  .char-controls{ flex:1 1 260px; min-width:240px; display:flex; flex-direction:column; gap:22px; }
  .field-label{ display:block; margin-bottom:10px; }
  .swatch-row{ display:flex; gap:9px; flex-wrap:wrap; }
  .skin-swatch{ width:30px; height:30px; border-radius:50%; border:2px solid transparent; cursor:pointer; padding:0; transition:transform 160ms ease, border-color 160ms ease; }
  .skin-swatch:hover{ transform:scale(1.08); }
  .skin-swatch.selected{ border-color:var(--ink); box-shadow:0 0 0 3px rgba(255,255,255,0.1); }
  .skin-swatch:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }

  .outfit-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(108px,1fr)); gap:10px; }
  .outfit-card{ border:1px solid var(--hairline); border-radius:12px; padding:10px; background:var(--void-3); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:8px; color:var(--ink-dim); font-size:0.76rem; transition:border-color 160ms ease, color 160ms ease; }
  .outfit-card:hover{ color:var(--ink); }
  .outfit-card.selected{ border-color:var(--realm-color); color:var(--ink); box-shadow:0 0 0 1px var(--realm-color) inset; }
  .outfit-swatch{ width:100%; height:32px; border-radius:8px; }
  .outfit-sub{ font-size:0.68rem; color:var(--ink-faint); }

  .gender-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .gender-pill{ border:1px solid var(--hairline); border-radius:999px; padding:0.5em 1.15em; background:transparent; color:var(--ink-dim); cursor:pointer; font-size:0.85rem; font-family:'Work Sans',sans-serif; transition:background 160ms ease, color 160ms ease, border-color 160ms ease; }
  .gender-pill:hover{ border-color:var(--realm-color); }
  .gender-pill.selected{ background:var(--realm-color); color:#0b0810; border-color:var(--realm-color); font-weight:600; }

  .char-save-row{ display:flex; align-items:center; gap:14px; margin-top:4px; min-height:1.4em; }
  .save-toast{ font-family:'JetBrains Mono',ui-monospace,monospace; font-size:0.72rem; letter-spacing:0.08em; color:var(--realm-color); opacity:0; transition:opacity 300ms ease; }
  .save-toast.show{ opacity:1; }
  .char-lore-link{ margin-top:8px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .char-lore-link .q-btn{ width:auto; }

  .streak-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; }
  .streak-chip{
    display:inline-block;
    font-family:'JetBrains Mono',ui-monospace,monospace; font-size:0.72rem; letter-spacing:0.06em;
    color:var(--realm-color); border:1px solid var(--hairline); padding:0.35em 0.9em; border-radius:999px;
  }
  .streak-chip.points{ color:var(--ink-dim); font-variant-numeric:tabular-nums; }

  .escape-block{
    margin-top:30px; padding-top:22px; border-top:1px solid var(--hairline); max-width:420px;
  }
  .escape-actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
  .escape-actions .q-btn{ width:auto; }

  .lore-form{ margin-top:26px; }
  .lore-input{
    width:100%; resize:vertical; min-height:96px; background:var(--void-3); border:1px solid var(--hairline); border-radius:14px;
    padding:0.85em 1em; color:var(--ink); font-family:'Work Sans',sans-serif; font-size:0.92rem; line-height:1.5;
  }
  .lore-input:focus-visible{ outline:2px solid var(--realm-color); outline-offset:1px; border-color:var(--realm-color); }
  .lore-actions{ display:flex; gap:12px; margin-top:12px; flex-wrap:wrap; }
  .lore-actions .q-btn{ width:auto; flex:0 0 auto; }
  .lore-note{ margin-top:12px; font-size:0.82rem; color:var(--realm-color); }
  .lore-note.error{ color:var(--hell-glow); }
  .lore-list{ margin-top:30px; display:flex; flex-direction:column; gap:14px; }
  .lore-empty{ color:var(--ink-faint); font-size:0.88rem; }
  .lore-item{ border:1px solid var(--hairline); border-radius:14px; padding:16px 18px; background:rgba(255,255,255,0.02); }
  .lore-item p{ margin:0; color:var(--ink); line-height:1.6; font-size:0.92rem; }
  .lore-author{ display:block; margin-top:10px; font-size:0.72rem; color:var(--ink-faint); }

  .vision-groups{ margin-top:28px; display:flex; flex-direction:column; gap:26px; }
  .vision-group-title{ display:flex; align-items:center; gap:8px; font-family:'JetBrains Mono',ui-monospace,monospace; font-size:0.68rem; letter-spacing:0.16em; text-transform:uppercase; color:var(--ink-faint); }
  .vision-group-title .dot{ width:7px; height:7px; border-radius:50%; display:inline-block; }
  .vision-list{ margin-top:12px; display:flex; flex-direction:column; gap:12px; }
  .vision-item{ border:1px solid var(--hairline); border-radius:14px; padding:14px 18px; background:rgba(255,255,255,0.02); transition:opacity 200ms ease; }
  .vision-item.locked{ opacity:0.45; }
  .vision-item h3{ margin:0; font-family:'Cinzel',serif; font-weight:600; font-size:0.95rem; color:var(--ink); letter-spacing:0.02em; }
  .vision-item p{ margin:8px 0 0; color:var(--ink-dim); line-height:1.65; font-size:0.88rem; }
  .vision-day{ font-family:'JetBrains Mono',ui-monospace,monospace; font-size:0.64rem; letter-spacing:0.1em; color:var(--ink-faint); text-transform:uppercase; }
  .vision-nav-dot{ display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--threshold-glow); margin-left:6px; box-shadow:0 0 8px var(--threshold-glow); vertical-align:middle; }

  .feedback-widget{
    position:fixed; z-index:6; max-width:min(88vw,320px);
    bottom:calc(16px + env(safe-area-inset-bottom));
    right:calc(16px + env(safe-area-inset-right));
  }
  .feedback-toggle{
    font-family:'JetBrains Mono',ui-monospace,monospace; font-size:0.68rem;
    background:rgba(13,10,23,0.75); color:var(--ink-dim); border:1px solid var(--hairline);
    border-radius:999px; padding:9px 16px; cursor:pointer;
    transition:border-color 160ms ease, color 160ms ease, background 160ms ease;
  }
  .feedback-toggle:hover{ border-color:var(--threshold-glow); color:var(--ink); }
  .feedback-toggle:focus-visible{ outline:2px solid var(--threshold-glow); outline-offset:2px; }
  .feedback-form{
    width:min(88vw,300px);
    background:var(--void-2); border:1px solid var(--hairline); border-radius:16px;
    padding:16px; box-shadow:0 20px 60px -20px rgba(0,0,0,0.75);
  }
  .feedback-head{
    display:flex; align-items:center; justify-content:space-between;
    font-family:'JetBrains Mono',ui-monospace,monospace; font-size:0.72rem; color:var(--ink-dim);
  }
  .feedback-close{
    background:none; border:none; color:var(--ink-faint); cursor:pointer;
    font-size:1.1rem; line-height:1; padding:0 2px;
  }
  .feedback-close:hover{ color:var(--ink); }
  .feedback-input{
    width:100%; margin-top:10px; resize:vertical; min-height:70px;
    background:var(--void-3); border:1px solid var(--hairline); border-radius:10px;
    padding:0.6em 0.8em; color:var(--ink); font-family:'Work Sans',sans-serif; font-size:0.85rem; line-height:1.5;
  }
  .feedback-input:focus-visible{ outline:2px solid var(--threshold-glow); outline-offset:1px; }
  .feedback-form .q-btn{ margin-top:10px; width:100%; }

  /* Hidden by default (desktop keeps the readable top realm-stats bar);
     the mobile media query below turns this on and hides that bar instead. */
  .soul-stats-btn.bi{ display:none; }

  .soul-stats-overlay{
    position:fixed; inset:0; z-index:20; background:rgba(5,4,9,0.72);
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .soul-stats-card{
    width:min(92vw,360px); max-height:80vh; overflow-y:auto;
    background:var(--void-2); border:1px solid var(--hairline); border-radius:20px;
    padding:22px; box-shadow:0 30px 80px -20px rgba(0,0,0,0.8);
  }
  .soul-stats-head{
    display:flex; align-items:center; justify-content:space-between;
    font-family:'Cinzel',serif; font-weight:600; font-size:1.05rem; color:var(--ink);
  }
  .soul-stats-you{ margin-top:16px; font-size:0.9rem; color:var(--ink-dim); line-height:1.5; }
  .soul-stats-list{ margin-top:18px; display:flex; flex-direction:column; gap:10px; }
  .soul-stats-supporters{ margin-top:22px; padding-top:18px; border-top:1px solid var(--hairline); display:flex; flex-direction:column; gap:8px; }
  .soul-stats-supporters .soul-stats-row{ font-size:0.82rem; }
  .soul-stats-row{ display:flex; align-items:center; gap:8px; font-size:0.85rem; color:var(--ink-dim); }
  .soul-stats-row .n{ margin-left:auto; color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums; }

  /* Placed last on purpose: later source order beats the earlier
     component rules above at equal specificity, so these reliably win on
     small screens without needing !important anywhere. */
  @media (max-width:600px){
    .threshold{ gap:16px; padding:18px; }
    .threshold-art{ width:88vw; }
    .threshold h1{ font-size:1.05rem; }
    .threshold p{ font-size:0.85rem; }
    .threshold-note{ font-size:0.7rem; }
    .enter-btn{ padding:0.7em 1.6em; font-size:0.85rem; }

    .signin-panel{ padding:20px 18px; }
    .field input{ font-size:0.88rem; padding:0.6em 0.75em; }

    .game-panel{ padding:20px 16px; border-radius:20px; }
    .q-eyebrow, .field-label{ font-size:0.6rem; letter-spacing:0.12em; }
    .q-heading{ font-size:1.1rem; }
    .q-tagline{ font-size:0.85rem; }
    .i18n-sub{ font-size:0.76rem; line-height:1.5; }
    .q-btn{ font-size:0.82rem; padding:0.7em 1.1em; }
    button.bi .btn-sub{ font-size:0.68em; }

    /* Stack the three top bars in one column instead of scattering them
       left/center/right — the wrapper takes over fixed positioning and
       the children fall back into normal flow inside it. */
    .top-bars{
      position:fixed; left:50%; transform:translateX(-50%); z-index:5;
      top:calc(8px + env(safe-area-inset-top));
      display:flex; flex-direction:column; align-items:center; gap:6px;
      width:94vw; max-width:360px;
    }
    .account-badge, .sound-toggle{
      position:static; top:auto; left:auto; right:auto; transform:none;
      width:auto; max-width:100%; font-size:0.6rem; padding:5px 10px;
    }
    /* Too small to read at this width no matter how it's shrunk — replaced
       by the Soul Stats button + pop-out sheet below. */
    .realm-stats{ display:none; }

    /* Bottom-left, not centered — the feedback widget owns bottom-right,
       and centering made the two collide on wider phones (e.g. iPhone 16
       Pro Max's 430px width). Safe-area-aware so it clears the home
       indicator instead of sitting under it. */
    /* .bi (selector button.bi) sets display:flex unconditionally for the
       stacked-label pattern and, being element+class, outranks a plain
       .soul-stats-btn class selector regardless of media query or source
       order. Matching .bi in these selectors too is what actually wins. */
    .soul-stats-btn.bi{
      display:flex;
      position:fixed; left:calc(16px + env(safe-area-inset-left)); z-index:6;
      bottom:calc(16px + env(safe-area-inset-bottom));
      opacity:0; visibility:hidden; transform:translateY(6px);
      transition:opacity 400ms ease, transform 400ms ease, visibility 0s linear 400ms;
      font-family:'JetBrains Mono',ui-monospace,monospace; font-size:0.68rem;
      background:rgba(13,10,23,0.82); color:var(--ink-dim); border:1px solid var(--hairline);
      border-radius:999px; padding:8px 18px; cursor:pointer;
    }
    .soul-stats-btn.bi.show{
      opacity:1; visibility:visible; transform:translateY(0);
      transition:opacity 400ms ease, transform 400ms ease;
    }

    .char-avatar{ width:110px; height:154px; }
    .char-layout{ gap:16px; margin-top:20px; }
    .char-chip{ font-size:0.6rem; }
    .outfit-grid{ grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:8px; }
    .outfit-card{ font-size:0.7rem; padding:8px; }
    .outfit-sub{ font-size:0.62rem; }
    .skin-swatch{ width:26px; height:26px; }
    .gender-pill{ padding:0.4em 0.9em; font-size:0.78rem; }

    .lore-input, .feedback-input{ font-size:0.82rem; }
    .lore-item{ padding:12px 14px; }
    .lore-item p{ font-size:0.85rem; }

    .feedback-widget{
      right:calc(8px + env(safe-area-inset-right));
      bottom:calc(8px + env(safe-area-inset-bottom));
      max-width:90vw;
    }
    .soul-stats-btn.bi{ left:calc(8px + env(safe-area-inset-left)); }
    .feedback-form{ width:min(90vw,270px); padding:14px; }
    .feedback-toggle{ font-size:0.62rem; padding:8px 14px; }

    .streak-row{ gap:6px; }
    .streak-chip{ font-size:0.64rem; padding:0.3em 0.7em; }
    .escape-block{ padding-top:18px; margin-top:22px; }
    .escape-actions{ gap:8px; }
  }

  @media (prefers-reduced-motion:reduce){ *{ transition-duration:1ms !important; animation-duration:1ms !important; } }
  .visually-hidden{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; padding:0; margin:-1px; }
</style>

  function dateKey(offsetDays){
    var d = new Date();
    if(offsetDays) d.setDate(d.getDate() + offsetDays);
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }

  function dayOfYear(d){
    var start = new Date(d.getFullYear(), 0, 0);
    var diff = d - start;
    return Math.floor(diff / 86400000);
  }

  function taskOfTheDay(realmKey){
    var pool = DAILY_TASKS[realmKey] || DAILY_TASKS.earth;
    return pool[dayOfYear(new Date()) % pool.length];
  }

  var POINTS_PER_TASK = 10;
  var MOVE_DOOR_COST = 50;

  // Cloud Functions for Stripe checkout and subscription management,
  // deployed from ./functions.
  var CHECKOUT_FUNCTION_URL = "https://us-central1-earthbase-f863b.cloudfunctions.net/createCheckoutSession";
  var PORTAL_FUNCTION_URL = "https://us-central1-earthbase-f863b.cloudfunctions.net/createPortalSession";

  // Messages shown on the sign-in screen after returning from Stripe
  // Checkout or the Billing Portal (see App's checkoutReturnInfo).
  var CHECKOUT_STATUS_TEXT = {
    donated: ["Thank you — your support helps keep the doors open.", "ありがとう — あなたの支援が扉を開き続けます。", "감사합니다 — 당신의 후원이 문을 계속 열어둡니다。"],
    cancelled: ["Checkout cancelled — you weren't charged.", "決済はキャンセルされました — 請求はありません。", "결제가 취소되었습니다 — 청구되지 않았습니다。"],
    portal: ["Your subscription settings were updated.", "サブスクリプション設定が更新されました。", "구독 설정이 업데이트되었습니다。"]
  };

  // Shared with App (not just the Tasks screen) so points earned here can
  // actually pay for moving to a different door.
  function useDailyTasks(accountId){
    var dbRef = useRef(null);
    var _s = useState({ streak:0, points:0, lastCompletedDate:null, unlockedVisions:[], resolvedFor:null });
    var state = _s[0], setState = _s[1];
    var loaded = !accountId || state.resolvedFor === accountId;

    useEffect(function(){
      if(!accountId){
        setState(function(s){ return Object.assign({}, s, { streak:0, points:0, lastCompletedDate:null, unlockedVisions:[], resolvedFor:null }); });
        return;
      }
      var cancelled = false;
      (async function(){
        var ns = dbRef.current || await getDb();
        dbRef.current = ns;
        var found = null;
        if(ns){
          try{
            var snap = await ns.doc("dailytasks/" + accountId).get();
            if(snap.exists) found = snap.data();
          }catch(e){}
        }
        if(!cancelled){
          setState({
            streak: (found && found.streak) || 0,
            points: (found && found.points) || 0,
            lastCompletedDate: (found && found.lastCompletedDate) || null,
            unlockedVisions: (found && found.unlockedVisions) || [],
            resolvedFor: accountId
          });
        }
      })();
      return function(){ cancelled = true; };
    }, [accountId]);

    async function markDone(realmKey, today){
      if(!accountId) return { ok:false };
      var wasYesterday = state.lastCompletedDate === dateKey(-1);
      var nextStreak = wasYesterday ? state.streak + 1 : 1;
      var nextPoints = state.points + POINTS_PER_TASK;
      var nextUnlocked = state.unlockedVisions.slice();
      var newVision = null;
      if(VISION_MILESTONES.indexOf(nextStreak) !== -1){
        var visionKey = realmKey + ":" + nextStreak;
        if(nextUnlocked.indexOf(visionKey) === -1){
          nextUnlocked.push(visionKey);
          newVision = visionKey;
        }
      }
      var ns = dbRef.current;
      if(ns){
        try{
          // A full set(), not update() — matches the existing shape of this
          // doc, so every field this doc holds has to be listed here or it
          // gets dropped, unlockedVisions included.
          await ns.doc("dailytasks/" + accountId).set({
            realm: realmKey, streak: nextStreak, points: nextPoints, lastCompletedDate: today, unlockedVisions: nextUnlocked
          });
        }catch(e){
          return { ok:false };
        }
      }
      setState(function(s){ return Object.assign({}, s, { streak:nextStreak, points:nextPoints, lastCompletedDate:today, unlockedVisions:nextUnlocked }); });
      return { ok:true, newVision: newVision };
    }

    async function spend(amount){
      if(state.points < amount) return { ok:false, reason:"points" };
      var nextPoints = state.points - amount;
      var ns = dbRef.current;
      if(ns && accountId){
        try{
          await ns.doc("dailytasks/" + accountId).update({ points: nextPoints });
        }catch(e){
          return { ok:false, reason:"save" };
        }
      }
      setState(function(s){ return Object.assign({}, s, { points:nextPoints }); });
      return { ok:true };
    }

    return { state: Object.assign({}, state, { loaded:loaded }), markDone: markDone, spend: spend };
  }

  // Door-opening sound, synthesized entirely with the Web Audio API — no
  // audio files to host. Each realm gets its own tonal character: a rising
  // sweep plus a filtered noise "breath," layered together.
  var DoorSound = (function(){
    var ctx = null;
    var muted = false;
    try{ muted = localStorage.getItem("doors_muted") === "1"; }catch(e){}

    var PROFILES = {
      heaven: { base:260, sweepTo:520, wave:"sine",     noiseColor:6000, drive:0 },
      earth:  { base:140, sweepTo:220, wave:"triangle", noiseColor:1800, drive:0 },
      hell:   { base:70,  sweepTo:55,  wave:"sawtooth", noiseColor:700,  drive:14 }
    };

    function ensureCtx(){
      if(!ctx){
        var AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return null;
        try{ ctx = new AC(); }catch(e){ return null; }
      }
      if(ctx.state === "suspended"){ ctx.resume().catch(function(){}); }
      return ctx;
    }

    function noiseBuffer(c, seconds){
      var len = Math.max(1, Math.floor(c.sampleRate * seconds));
      var buf = c.createBuffer(1, len, c.sampleRate);
      var data = buf.getChannelData(0);
      for(var i = 0; i < len; i++){ data[i] = Math.random() * 2 - 1; }
      return buf;
    }

    function distortionCurve(amount){
      var n = 4096;
      var curve = new Float32Array(n);
      for(var i = 0; i < n; i++){
        var x = (i * 2) / n - 1;
        curve[i] = (3 + amount) * x * 20 * (Math.PI / 180) / (Math.PI + amount * Math.abs(x));
      }
      return curve;
    }

    function play(realmKey){
      if(muted) return;
      var c = ensureCtx();
      if(!c) return;
      var p = PROFILES[realmKey] || PROFILES.earth;
      var now = c.currentTime;
      var dur = 1.1;

      var master = c.createGain();
      master.gain.setValueAtTime(0, now);
      master.gain.linearRampToValueAtTime(0.5, now + 0.06);
      master.gain.linearRampToValueAtTime(0.3, now + dur * 0.55);
      master.gain.linearRampToValueAtTime(0, now + dur);
      master.connect(c.destination);

      var osc = c.createOscillator();
      osc.type = p.wave;
      osc.frequency.setValueAtTime(p.base, now);
      osc.frequency.exponentialRampToValueAtTime(Math.max(20, p.sweepTo), now + dur * 0.85);

      var oscFilter = c.createBiquadFilter();
      oscFilter.type = "lowpass";
      oscFilter.frequency.setValueAtTime(p.base * 1.5, now);
      oscFilter.frequency.linearRampToValueAtTime(p.sweepTo * 4, now + dur * 0.7);
      oscFilter.Q.value = 0.7;

      if(p.drive > 0){
        var shaper = c.createWaveShaper();
        shaper.curve = distortionCurve(p.drive);
        osc.connect(shaper);
        shaper.connect(oscFilter);
      }else{
        osc.connect(oscFilter);
      }
      oscFilter.connect(master);

      var noise = c.createBufferSource();
      noise.buffer = noiseBuffer(c, dur);
      var noiseFilter = c.createBiquadFilter();
      noiseFilter.type = "bandpass";
      noiseFilter.frequency.setValueAtTime(p.noiseColor * 0.4, now);
      noiseFilter.frequency.linearRampToValueAtTime(p.noiseColor, now + dur * 0.6);
      noiseFilter.Q.value = 0.9;
      var noiseGain = c.createGain();
      noiseGain.gain.setValueAtTime(0, now);
      noiseGain.gain.linearRampToValueAtTime(0.22, now + 0.08);
      noiseGain.gain.linearRampToValueAtTime(0, now + dur);

      noise.connect(noiseFilter);
      noiseFilter.connect(noiseGain);
      noiseGain.connect(master);

      osc.start(now);
      osc.stop(now + dur + 0.05);
      noise.start(now);
      noise.stop(now + dur + 0.05);
    }

    return {
      play: play,
      unlock: function(){ ensureCtx(); },
      isMuted: function(){ return muted; },
      setMuted: function(v){
        muted = v;
        try{ localStorage.setItem("doors_muted", v ? "1" : "0"); }catch(e){}
      }
    };
  })();

  function getDb(){
    return new Promise(function(resolve){
      if(window.doorsDb){ resolve(window.doorsDb); return; }
      var handled = false;
      function onReady(){ if(handled) return; handled = true; resolve(window.doorsDb || null); }
      window.addEventListener("doorsFirebaseReady", onReady, { once:true });
      setTimeout(function(){ if(!handled){ handled = true; resolve(window.doorsDb || null); } }, 8000);
    });
  }

  function sanitizeHandle(raw){
    var s = (raw || "").trim().toLowerCase();
    s = s.replace(/\s+/g, "-");
    s = s.replace(/[^a-z0-9_\-.~:@+]/g, "");
    return s.slice(0, 40);
  }

  // Email addresses are already valid Firestore path segments (letters,
  // digits, @ . _ - are all allowed) — this just normalizes and strips
  // anything outside that set, so the address itself is the doc id and
  // resubmitting the same email updates one record instead of duplicating.
  function sanitizeEmailKey(raw){
    var s = (raw || "").trim().toLowerCase();
    s = s.replace(/[^a-z0-9_\-.~:@+]/g, "");
    return s.slice(0, 200);
  }

  async function sha256Hex(str){
    var enc = new TextEncoder().encode(str);
    var buf = await crypto.subtle.digest("SHA-256", enc);
    var arr = Array.from(new Uint8Array(buf));
    return arr.map(function(b){ return b.toString(16).padStart(2, "0"); }).join("");
  }

  // GA4 event helper. window.gtag is defined synchronously in <head> (the
  // async script just fills it in later), so this is safe to call from
  // the moment the app mounts, before the GA library itself has loaded —
  // early calls queue in dataLayer and get processed once it does. Never
  // pass PII (email, passphrase, free-text content) as a param.
  function trackEvent(name, params){
    try{ if(window.gtag) window.gtag("event", name, params || {}); }catch(e){}

  function useDoorsDb(accountId){
    var dbRef = useRef(null);
    var unsubRef = useRef(null);
    var _s = useState({ ready:false, offline:false, counts:{heaven:0, earth:0, hell:0}, myChoice:null, resolvedFor:null });
    var state = _s[0], setState = _s[1];
    // Derived fresh every render (not tracked as its own async-set flag) so
    // there's no one-render lag where a stale ready/myChoice from a
    // different (or no) account briefly looks valid for the new one.
    var myChoiceReady = !accountId || state.resolvedFor === accountId;

    useEffect(function(){
      var cancelled = false;
      (async function(){
        var ns = await getDb();
        if(cancelled) return;
        if(!ns){
          setState(function(s){ return Object.assign({}, s, {ready:true, offline:true}); });
          return;
        }
        dbRef.current = ns;
        try{
          var unsub = ns.collection("votes").onSnapshot(function(snap){
            var counts = {heaven:0, earth:0, hell:0};
            snap.docs.forEach(function(d){
              var data = d.data();
              var door = data && data.door;
              if(door && Object.prototype.hasOwnProperty.call(counts, door)){
                counts[door] += 1;
              }
            });
            setState(function(s){ return Object.assign({}, s, {ready:true, offline:false, counts:counts}); });
          }, function(err){
            setState(function(s){ return Object.assign({}, s, {ready:true, offline:true}); });
          });
          unsubRef.current = unsub;
        }catch(e){
          setState(function(s){ return Object.assign({}, s, {ready:true, offline:true}); });
        }
      })();
      return function(){
        cancelled = true;
        if(unsubRef.current) unsubRef.current();
      };
    }, []);

    useEffect(function(){
      if(!accountId){
        setState(function(s){ return Object.assign({}, s, {myChoice:null, resolvedFor:null}); });
        return;
      }
      var cancelled = false;
      (async function(){
        var ns = dbRef.current || await getDb();
        dbRef.current = ns;
        if(!ns){
          if(!cancelled) setState(function(s){ return Object.assign({}, s, {resolvedFor:accountId}); });
          return;
        }
        try{
          var mine = await ns.doc("votes/" + accountId).get();
          var myChoice = (mine.exists && mine.data() && mine.data().door) ? mine.data().door : null;
          if(!cancelled){
            setState(function(s){ return Object.assign({}, s, {myChoice: myChoice, resolvedFor: accountId}); });
          }
        }catch(e){
          if(!cancelled) setState(function(s){ return Object.assign({}, s, {resolvedFor: accountId}); });
        }
      })();
      return function(){ cancelled = true; };
    }, [accountId, state.ready]);

    function choose(doorKey){
      setState(function(s){ return Object.assign({}, s, {myChoice: doorKey}); });
      var ns = dbRef.current;
      if(!ns || !accountId) return;
      ns.doc("votes/" + accountId).set({ door: doorKey, ts: Date.now() }).catch(function(){});
    }

    return { state: Object.assign({}, state, { myChoiceReady: myChoiceReady }), choose: choose };
  }

      h("div", { className:"q-eyebrow" }, "You are in " + realm.name),
      h(Sub, { ja: realm.nameJa, ko: realm.nameKo }),
      h("h2", { className:"q-heading" }, "Are you satisfied with your choice of door?"),
      h(Sub, { ja:"その扉の選択に満足しているか？", ko:"그 문의 선택에 만족하는가?" }),
      h("p", { className:"q-tagline" }, realm.tagline),
      h(Sub, { ja: realm.taglineJa, ko: realm.taglineKo }),
      h("div", { className:"q-actions" },
        h("button", { className:"q-btn primary bi", onClick: props.onSatisfied },
          biLabel("Yes — I'm satisfied", "ええ——満足しています", "네 — 만족합니다")),
        others.map(function(d){
          return h("button", {
            key: d.key, className:"q-btn ghost bi",
            onClick: function(){ props.onEscape(d.key); }
          }, biLabel("Escape to " + d.label, d.labelJa + "へ逃げる", d.labelKo + "(으)로 도망치다"));
        }),
        h("button", { className:"q-btn exit", onClick: props.onExit }, "Exit the game completely  ·  ゲームを完全に終了する  ·  게임을 완전히 종료하다")
      )
    );
  }

  function GameScreen(props){
    var key = props.doorKey || "earth";
    var styleVars = {
      "--realm-color": "var(--" + key + ")",
      "--realm-glow": "var(--" + key + "-glow)",
      "--realm-deep": "var(--" + key + "-deep)"
    };
    var content;
    if(props.gamePhase === "character"){
      content = h(CharacterCreator, {
        key: "char-" + props.accountId,
        accountId: props.accountId,
        doorKey: key,
        authorName: props.authorName,
        onOpenLore: props.onOpenLore,
        onOpenTasks: props.onOpenTasks,
        onOpenVisions: props.onOpenVisions,
        hasNewVision: props.hasNewVision,
        onDonate: props.onDonate,
        onTip: props.onTip,
        onManageSubscription: props.onManageSubscription
      });
    }else if(props.gamePhase === "lore"){
      content = h(LoreScreen, {
        key: "lore-" + key,
        doorKey: key,
        authorName: props.authorName,
        onBack: props.onBackToCharacter
      });
    }else if(props.gamePhase === "visions"){
      content = h(VisionsScreen, {
        key: "visions-" + props.accountId,
        doorKey: key,
        unlockedVisions: props.unlockedVisions,
        onBack: props.onBackToCharacter
      });
    }else if(props.gamePhase === "tasks"){
      content = h(DailyTasks, {
        key: "tasks-" + props.accountId,
        doorKey: key,
        today: props.today,
        todaysTask: props.todaysTask,
        state: props.dailyTasksState,
        onMarkDone: props.onMarkDone,
        onMove: props.onMove,
        onBack: props.onBackToCharacter
      });
    }else{
      content = h(QuestionScreen, {
        key: "q-" + key, doorKey: key,
        onSatisfied: props.onSatisfied, onEscape: props.onEscape, onExit: props.onExit
      });
    }
    return h("div", { className:"gamewrap" + (props.active ? " active" : "") },
      h("div", { className:"game-panel", style: styleVars }, content)
    );
  }

    // Returning from Stripe Checkout or the Billing Portal lands back here
    // with a query param — skip the threshold screen straight to sign-in
    // (name is already remembered) instead of making them click through
    // the intro again, and surface what happened.
    function checkoutReturnInfo(){
      try{
        var params = new URLSearchParams(window.location.search);
        if(params.has("donated") || params.has("portal")){
          var status = params.get("donated") === "1" ? "donated"
            : params.get("donated") === "0" ? "cancelled"
            : "portal";
          return { phase: "resuming", status: status };
        }
      }catch(e){}
      return { phase: "threshold", status: null };
    }

  function App(){
    var _returnInfo = useState(checkoutReturnInfo);
    var returnInfo = _returnInfo[0];
    var _p = useState(returnInfo.phase);
    var phase = _p[0], setPhase = _p[1];
    var _cs = useState(returnInfo.status);
    var checkoutStatus = _cs[0], setCheckoutStatus = _cs[1];
    var _g = useState("question");
    var gamePhase = _g[0], setGamePhase = _g[1];
    var _a = useState(null);
    var account = _a[0], setAccount = _a[1];
    var _snd = useState(function(){ return DoorSound.isMuted(); });
    var muted = _snd[0], setMuted = _snd[1];
    var _ss = useState(false);
    var soulStatsOpen = _ss[0], setSoulStatsOpen = _ss[1];
    var _nv = useState(false);
    var hasNewVision = _nv[0], setHasNewVision = _nv[1];
    var doors = useDoorsDb(account ? account.id : null);
    var dailyTasks = useDailyTasks(account ? account.id : null);
    var redirectTimer = useRef(null);

    useEffect(function(){
      if(!checkoutStatus) return;
      try{
        var url = new URL(window.location.href);
        url.searchParams.delete("donated");
        url.searchParams.delete("portal");
        window.history.replaceState({}, "", url.pathname + url.search);
      }catch(e){}
    }, []);

    // Stripe Checkout and the Billing Portal are a full page navigation
    // away, so the SPA's in-memory account is gone by the time the visitor
    // is redirected back. There's no verified auth token to restore (see
    // SignIn's disclaimer), but the same-device passphrase hash saved at
    // sign-in is: reuse it to resume straight to the character screen
    // instead of asking them to type the passphrase again right after
    // they just came from Stripe. Falls through to the normal sign-in
    // screen (with the checkoutStatus message) if nothing usable is saved.
    useEffect(function(){
      if(!checkoutStatus) return;
      var cancelled = false;
      (async function(){
        var resumed = false;
        try{
          var lastHandle = localStorage.getItem("doors_last_handle") || "";
          var id = sanitizeHandle(lastHandle);
          if(id){
            var storedHash = localStorage.getItem("doors_session_" + id);
            if(storedHash){
              var ns = await getDb();
              if(ns && !cancelled){
                var snap = await ns.doc("accounts/" + id).get();
                if(!cancelled && snap.exists){
                  var data = snap.data();
                  if(data && data.passHash === storedHash){
                    handleSignedIn(id, data.displayName || lastHandle);
                    resumed = true;
                  }
                }
              }
            }
          }
        }catch(e){}
        // No usable saved session (new browser, cleared storage, or this
        // is the visitor's first sign-in since this feature shipped) —
        // fall through to the ordinary, visible sign-in screen instead of
        // leaving them stuck on the resuming screen forever.
        if(!cancelled && !resumed) setPhase("signin");
      })();
      return function(){ cancelled = true; };
    }, []);

    useEffect(function(){ setSoulStatsOpen(false); }, [phase]);

    // A raw page-view counter, independent of sign-in — every load of the
    // site counts, whether or not that visitor ever creates an account.
    // One aggregate doc per day (not one doc per view) so this can't grow
    // into thousands of documents over time.
    useEffect(function(){
      (async function(){
        var ns = await getDb();
        if(!ns) return;
        try{
          await ns.doc("pageviews/" + dateKey(0)).set(
            { count: ns.increment(1), lastAt: Date.now() },
            { merge: true }
          );
        }catch(e){}
      })();
    }, []);

    function toggleSound(){
      var next = !muted;
      DoorSound.setMuted(next);
      setMuted(next);
    }

    // First-time choice: let the door swing open on the Hall screen, then
    // carry the visitor into the game.
    useEffect(function(){
      if(phase === "hall" && doors.state.ready && doors.state.myChoice){
        redirectTimer.current = setTimeout(function(){
          setPhase("game");
          setGamePhase("question");
        }, 1100);
        return function(){ clearTimeout(redirectTimer.current); };
      }
    }, [phase, doors.state.ready, doors.state.myChoice]);

    // Returning visitor: once we know (not just assume) whether this account
    // already has a door, route straight there — the Hall/doors screen and
    // the satisfied/escape question are both skipped, straight to their
    // character. That question only ever shows once, right after a door is
    // freshly chosen (see the effect above); signing back in later goes
    // straight to the avatar.
    useEffect(function(){
      if((phase === "signin" || phase === "resuming") && account && doors.state.myChoiceReady){
        if(doors.state.myChoice){
          setGamePhase("character");
          setPhase("game");
        }else{
          setPhase("hall");
        }
      }
    }, [phase, account, doors.state.myChoiceReady, doors.state.myChoice]);

    function handleSignedIn(id, displayName){
      setAccount({ id: id, displayName: displayName });
      setCheckoutStatus(null);
    }

    function handleSignOut(){
      setAccount(null);
      setPhase("signin");
    }

    function handleChooseDoor(key){
      if(doors.state.myChoice && doors.state.myChoice !== key) return;
      if(!doors.state.myChoice){
        doors.choose(key);
        trackEvent("choose_door", { door: key });
      }
    }

    function handleSatisfied(){
      trackEvent("satisfied_choice", { door: doors.state.myChoice });
      setGamePhase("character");
    }
    function handleEscape(newKey){
      trackEvent("escape_door", { from: doors.state.myChoice, to: newKey });
      doors.choose(newKey);
      setGamePhase("question");
    }
    function handleExit(){ setPhase("threshold"); setGamePhase("question"); }
    function handleOpenLore(){ setGamePhase("lore"); }
    function handleOpenTasks(){ setGamePhase("tasks"); }
    function handleOpenVisions(){ setHasNewVision(false); setGamePhase("visions"); }
    function handleBackToCharacter(){ setGamePhase("character"); }
    async function handleMarkDone(){
      var result = await dailyTasks.markDone(doors.state.myChoice, dateKey(0));
      if(result && result.ok){
        trackEvent("complete_daily_task", { door: doors.state.myChoice });
        if(result.newVision){
          trackEvent("unlock_vision", { vision: result.newVision });
          setHasNewVision(true);
        }
      }
      return result;
    }
    async function handleMoveDoor(newKey){
      var result = await dailyTasks.spend(MOVE_DOOR_COST);
      if(!result.ok) return result;
      trackEvent("move_door", { from: doors.state.myChoice, to: newKey });
      doors.choose(newKey);
      setGamePhase("character");
      return { ok:true };
    }

    async function handleDonate(){
      if(!account) return;
      try{
        var res = await fetch(CHECKOUT_FUNCTION_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ accountId: account.id, displayName: account.displayName, kind: "subscribe" })
        });
        var data = await res.json();
        if(data && data.url){
          trackEvent("begin_checkout", { door: doors.state.myChoice });
          window.location.href = data.url;
        }
      }catch(e){}
    }

    async function handleTip(amountCents){
      if(!account) return;
      try{
        var res = await fetch(CHECKOUT_FUNCTION_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ accountId: account.id, displayName: account.displayName, kind: "tip", amountCents: amountCents })
        });
        var data = await res.json();
        if(data && data.url){
          trackEvent("begin_checkout", { door: doors.state.myChoice, tip_cents: amountCents });
          window.location.href = data.url;
        }
      }catch(e){}
    }

    async function handleManageSubscription(){
      if(!account) return { ok:false, error:"Not signed in." };
      try{
        var res = await fetch(PORTAL_FUNCTION_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ accountId: account.id })
        });
        var data = await res.json();
        if(res.ok && data && data.url){
          trackEvent("open_billing_portal", { door: doors.state.myChoice });
          window.location.href = data.url;
          return { ok:true };
        }
        return { ok:false, error: (data && data.error) || "Could not open subscription management." };
      }catch(e){
        return { ok:false, error:"Could not open subscription management." };
      }
    }

    var showBadge = !!account && (phase === "hall" || phase === "game");
    var showControls = phase !== "threshold";
    var showStats = phase === "hall" || phase === "game";

    return h(React.Fragment, null,
      h("div", { className:"stars" }),
      h("div", { className:"top-bars" },
        h("button", {
            className:"sound-toggle" + (showControls ? " show" : ""),
            type:"button", onClick: toggleSound
          },
          muted ? "sound: off  ·  音：オフ  ·  소리: 꺼짐" : "sound: on  ·  音：オン  ·  소리: 켜짐"
        ),
        h(RealmStats, {
          show: showStats,
          counts: doors.state.counts,
          myRealm: phase === "game" ? doors.state.myChoice : null
        }),
        h("div", { className:"account-badge" + (showBadge ? " show" : "") },
          account ? h("span", { className:"name" },
            "signed in as " + account.displayName + " · " + dailyTasks.state.points + " pts"
          ) : null,
          account ? h("button", { className:"link-btn", onClick: handleSignOut }, "not you?") : null
        )
      ),
      h(SoulStatsButton, { show: showStats, onOpen: function(){ setSoulStatsOpen(true); } }),
      h(SoulStatsSheet, {
        open: soulStatsOpen,
        counts: doors.state.counts,
        myRealm: phase === "game" ? doors.state.myChoice : null,
        onClose: function(){ setSoulStatsOpen(false); }
      }),
      h(Threshold, {
        leaving: phase !== "threshold",
        onEnter: function(){ DoorSound.unlock(); setPhase("signin"); }
      }),
      h(SignIn, { active: phase === "signin", onSignedIn: handleSignedIn, checkoutStatus: checkoutStatus }),
      h("div", { className:"resuming" + (phase === "resuming" ? " active" : "") },
        h("div", { className:"q-eyebrow bi" }, biLabel("Returning…", "戻っています…", "돌아가는 중…"))
      ),
      h(Hall, { active: phase === "hall", dbState: doors.state, onChoose: handleChooseDoor }),
      h(GameScreen, {
        active: phase === "game",
        doorKey: doors.state.myChoice,
        accountId: account ? account.id : null,
        authorName: account ? account.displayName : null,
        gamePhase: gamePhase,
        today: dateKey(0),
        todaysTask: doors.state.myChoice ? taskOfTheDay(doors.state.myChoice) : null,
        dailyTasksState: dailyTasks.state,
        unlockedVisions: dailyTasks.state.unlockedVisions,
        hasNewVision: hasNewVision,
        onSatisfied: handleSatisfied,
        onEscape: handleEscape,
        onExit: handleExit,
        onOpenLore: handleOpenLore,
        onOpenTasks: handleOpenTasks,
        onOpenVisions: handleOpenVisions,
        onBackToCharacter: handleBackToCharacter,
        onMarkDone: handleMarkDone,
        onMove: handleMoveDoor,
        onDonate: handleDonate,
        onTip: handleTip,
        onManageSubscription: handleManageSubscription
      })
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
</body>
</html>
