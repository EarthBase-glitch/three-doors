<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three Doors — Stats</title>
<link rel="canonical" href="https://threedoorsearthbase9.com/stats.html">
<style>
  :root{
    --void:#07060b; --void-2:#0d0a17; --void-3:#150f24;
    --ink:#ece7f7; --ink-dim:#a89bc4; --ink-faint:#5f5578;
    --accent:#c9b6ff; --hairline: rgba(236,231,247,0.12);
    --ok:#7fc26a; --bad:#ff6a3d; --warn:#e0a83e;
    --hell:#ff6a3d; --earth:#7fc26a; --heaven:#8fd4ff;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; background:var(--void); color:var(--ink); font-family: ui-sans-serif, system-ui, sans-serif; padding:24px; }
  h1{ font-family:'Georgia',serif; font-size:1.4rem; margin:0 0 4px; }
  h2{ font-size:0.95rem; margin:0 0 14px; color:var(--ink-dim); font-weight:600; letter-spacing:0.02em; }
  .sub{ color:var(--ink-dim); font-size:0.9rem; margin:0 0 24px; }

  #signin{ max-width:360px; margin:60px auto; background:var(--void-2); border:1px solid var(--hairline); border-radius:16px; padding:28px; }
  #signin label{ display:block; font-size:0.72rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-faint); margin-top:14px; }
  #signin input{ width:100%; margin-top:6px; padding:0.6em 0.8em; background:var(--void-3); border:1px solid var(--hairline); border-radius:8px; color:var(--ink); font-size:0.95rem; }
  #signin button{ width:100%; margin-top:20px; background:var(--accent); color:#0b0810; border:none; border-radius:999px; padding:0.7em 1.2em; font-weight:600; cursor:pointer; }
  #error{ color:var(--bad); font-size:0.85rem; min-height:1.2em; }

  #app{ display:none; max-width:860px; margin:0 auto; }
  #signout{ float:right; background:none; border:1px solid var(--hairline); color:var(--ink-dim); border-radius:999px; padding:0.4em 1em; cursor:pointer; font-size:0.8rem; }
  #refreshed{ font-size:0.78rem; color:var(--ink-faint); }

  section{ margin-top:34px; }
  .tiles{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
  .tile{ background:var(--void-2); border:1px solid var(--hairline); border-radius:14px; padding:16px 18px; }
  .tile .n{ font-size:1.7rem; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.1; }
  .tile .label{ margin-top:6px; font-size:0.76rem; color:var(--ink-dim); }
  .tile .note{ margin-top:2px; font-size:0.72rem; color:var(--ink-faint); }

  .chart{ background:var(--void-2); border:1px solid var(--hairline); border-radius:14px; padding:18px 20px; }
  .bar-row{ display:flex; align-items:center; gap:10px; margin-top:10px; }
  .bar-row:first-child{ margin-top:0; }
  .bar-label{ width:130px; flex:0 0 auto; font-size:0.82rem; color:var(--ink-dim); text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar-track{ flex:1 1 auto; height:14px; background:var(--void-3); border-radius:7px; overflow:hidden; position:relative; }
  .bar-fill{ height:100%; border-radius:7px; min-width:3px; }
  .bar-value{ width:56px; flex:0 0 auto; font-size:0.82rem; font-variant-numeric:tabular-nums; color:var(--ink); text-align:right; }

  .daybars{ display:flex; align-items:flex-end; gap:4px; height:120px; margin-top:12px; }
  .daybar{ flex:1 1 0; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:4px; min-width:0; }
  .daybar .col{ width:100%; max-width:22px; background:var(--accent); border-radius:3px 3px 0 0; min-height:2px; }
  .daybar .val{ font-size:0.62rem; color:var(--ink-dim); font-variant-numeric:tabular-nums; }
  .daybar .day{ font-size:0.58rem; color:var(--ink-faint); white-space:nowrap; }

  .empty{ color:var(--ink-faint); font-size:0.88rem; }
  .legend-note{ margin-top:14px; font-size:0.74rem; color:var(--ink-faint); }
</style>
</head>
<body>
  <div id="signin">
    <h1>Stats</h1>
    <p class="sub">Sign in with the admin account.</p>
    <div id="error"></div>
    <form id="signin-form">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
  </div>

  <div id="app">
    <button id="signout">Sign out</button>
    <h1>Three Doors — Stats</h1>
    <p class="sub" id="refreshed">Loading…</p>

    <section>
      <h2>Overview</h2>
      <div class="tiles" id="tiles"></div>
    </section>

    <section>
      <h2>Souls per realm</h2>
      <div class="chart" id="realm-chart"></div>
    </section>

    <section>
      <h2>Page views, last 14 days</h2>
      <div class="chart"><div class="daybars" id="views-chart"></div></div>
    </section>

    <section>
      <h2>New souls, last 14 days</h2>
      <div class="chart"><div class="daybars" id="day-chart"></div></div>
    </section>

    <section>
      <h2>Streak distribution</h2>
      <div class="chart" id="streak-chart"></div>
      <p class="legend-note">How many souls currently hold a streak of each length, across all realms.</p>
    </section>

    <section>
      <h2>Community lore submissions</h2>
      <div class="chart" id="lore-chart"></div>
    </section>
  </div>

  <script src="firebase-config.js"></script>
  <script type="module" src="firebase-adapter.js"></script>
  <script type="module">
    var REALM_NAMES = { hell:"Hell", earth:"Reincarnation", heaven:"Heaven" };
    var REALM_COLORS = { hell:"var(--hell)", earth:"var(--earth)", heaven:"var(--heaven)" };
    var REALM_ORDER = ["hell", "earth", "heaven"];

    function dateKey(d){
      var y = d.getFullYear();
      var m = String(d.getMonth() + 1).padStart(2, "0");
      var day = String(d.getDate()).padStart(2, "0");
      return y + "-" + m + "-" + day;
    }

    function tile(n, label, note){
      var el = document.createElement("div");
      el.className = "tile";
      el.innerHTML = '<div class="n"></div><div class="label"></div>' + (note ? '<div class="note"></div>' : "");
      el.querySelector(".n").textContent = n;
      el.querySelector(".label").textContent = label;
      if(note) el.querySelector(".note").textContent = note;
      return el;
    }

    function barRow(label, value, max, color){
      var row = document.createElement("div");
      row.className = "bar-row";
      var pct = max > 0 ? Math.max((value / max) * 100, value > 0 ? 2 : 0) : 0;
      row.innerHTML =
        '<div class="bar-label"></div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%; background:' + color + ';"></div></div>' +
        '<div class="bar-value"></div>';
      row.querySelector(".bar-label").textContent = label;
      row.querySelector(".bar-value").textContent = value;
      return row;
    }

    async function ready(){
      var signinEl = document.getElementById("signin");
      var appEl = document.getElementById("app");
      var errorEl = document.getElementById("error");

      window.doorsAuth.onChange(function(user){
        if(user){
          signinEl.style.display = "none";
          appEl.style.display = "block";
          load();
        }else{
          signinEl.style.display = "block";
          appEl.style.display = "none";
        }
      });

      document.getElementById("signin-form").addEventListener("submit", function(e){
        e.preventDefault();
        errorEl.textContent = "";
        var email = document.getElementById("email").value.trim();
        var password = document.getElementById("password").value;
        window.doorsAuth.signIn(email, password).catch(function(){
          errorEl.textContent = "Sign-in failed — check the email and password.";
        });
      });

      document.getElementById("signout").addEventListener("click", function(){
        window.doorsAuth.signOut();
      });

      async function fetchAll(collection){
        var snap = await window.doorsDb.collection(collection).get();
        return snap.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); });
      }

      async function load(){
        var refreshedEl = document.getElementById("refreshed");
        refreshedEl.textContent = "Loading…";

        var accounts, votes, characters, dailytasks, submissions, feedback, emails, pageviews;
        try{
          var results = await Promise.all([
            fetchAll("accounts"),
            fetchAll("votes"),
            fetchAll("characters"),
            fetchAll("dailytasks"),
            fetchAll("submissions"),
            fetchAll("feedback"),
            fetchAll("emails"),
            fetchAll("pageviews")
          ]);
          accounts = results[0]; votes = results[1]; characters = results[2];
          dailytasks = results[3]; submissions = results[4]; feedback = results[5]; emails = results[6];
          pageviews = results[7];
        }catch(err){
          refreshedEl.textContent = "Couldn't load data — check the console for details.";
          console.error(err);
          return;
        }

        refreshedEl.textContent = "Updated " + new Date().toLocaleString();

        // ---- Overview tiles ----
        var today = dateKey(new Date());
        var activeToday = dailytasks.filter(function(t){ return t.lastCompletedDate === today; }).length;
        var totalPoints = dailytasks.reduce(function(sum, t){ return sum + (t.points || 0); }, 0);
        var streaks = dailytasks.map(function(t){ return t.streak || 0; }).filter(function(s){ return s > 0; });
        var avgStreak = streaks.length ? (streaks.reduce(function(a, b){ return a + b; }, 0) / streaks.length) : 0;
        var longestStreak = streaks.length ? Math.max.apply(null, streaks) : 0;
        var pendingLore = submissions.filter(function(s){ return s.status === "pending"; }).length;
        var charactersBuilt = characters.length;
        var totalViews = pageviews.reduce(function(sum, p){ return sum + (p.count || 0); }, 0);
        var viewsToday = (pageviews.filter(function(p){ return p.id === today; })[0] || {}).count || 0;

        var tilesEl = document.getElementById("tiles");
        tilesEl.innerHTML = "";
        tilesEl.appendChild(tile(totalViews, "Page views (all time)"));
        tilesEl.appendChild(tile(viewsToday, "Views today"));
        tilesEl.appendChild(tile(accounts.length, "Souls signed in"));
        tilesEl.appendChild(tile(votes.length, "Doors opened"));
        tilesEl.appendChild(tile(charactersBuilt, "Characters built"));
        tilesEl.appendChild(tile(activeToday, "Active today", "completed today's task"));
        tilesEl.appendChild(tile(avgStreak.toFixed(1), "Average streak", "days, among active streaks"));
        tilesEl.appendChild(tile(longestStreak, "Longest streak", "days"));
        tilesEl.appendChild(tile(totalPoints, "Total points earned"));
        tilesEl.appendChild(tile(submissions.length, "Lore submissions", pendingLore + " pending review"));
        tilesEl.appendChild(tile(feedback.length, "Suggestions received"));
        tilesEl.appendChild(tile(emails.length, "Emails collected"));

        // ---- Souls per realm ----
        var realmCounts = { hell:0, earth:0, heaven:0 };
        votes.forEach(function(v){
          if(v.door && realmCounts.hasOwnProperty(v.door)) realmCounts[v.door] += 1;
        });
        var realmChartEl = document.getElementById("realm-chart");
        realmChartEl.innerHTML = "";
        var realmMax = Math.max(1, realmCounts.hell, realmCounts.earth, realmCounts.heaven);
        if(votes.length === 0){
          realmChartEl.innerHTML = '<p class="empty">No doors opened yet.</p>';
        }else{
          REALM_ORDER.forEach(function(key){
            realmChartEl.appendChild(barRow(REALM_NAMES[key], realmCounts[key], realmMax, REALM_COLORS[key]));
          });
        }

        // ---- Last-14-days helpers, shared by the views and signups charts ----
        function last14Days(){
          var labels = [];
          for(var i = 13; i >= 0; i--){
            var d = new Date();
            d.setDate(d.getDate() - i);
            labels.push({ key: dateKey(d), label: (d.getMonth() + 1) + "/" + d.getDate() });
          }
          return labels;
        }
        function renderDayChart(elId, dayLabels, counts){
          var el = document.getElementById(elId);
          el.innerHTML = "";
          var max = Math.max(1, Math.max.apply(null, dayLabels.map(function(d){ return counts[d.key] || 0; })));
          dayLabels.forEach(function(d){
            var count = counts[d.key] || 0;
            var col = document.createElement("div");
            col.className = "daybar";
            var heightPct = Math.max((count / max) * 100, count > 0 ? 4 : 0);
            col.innerHTML =
              '<div class="val"></div>' +
              '<div class="col" style="height:' + heightPct + '%;"></div>' +
              '<div class="day"></div>';
            col.querySelector(".val").textContent = count > 0 ? count : "";
            col.querySelector(".day").textContent = d.label;
            el.appendChild(col);
          });
        }

        // ---- Page views per day, last 14 days (already daily-aggregated) ----
        var viewCounts = {};
        pageviews.forEach(function(p){ viewCounts[p.id] = p.count || 0; });
        renderDayChart("views-chart", last14Days(), viewCounts);

        // ---- New souls per day, last 14 days ----
        var dayCounts = {};
        accounts.forEach(function(a){
          if(!a.createdAt) return;
          var key = dateKey(new Date(a.createdAt));
          dayCounts[key] = (dayCounts[key] || 0) + 1;
        });
        renderDayChart("day-chart", last14Days(), dayCounts);

        // ---- Streak distribution ----
        var buckets = [
          { label: "No streak", test: function(s){ return s === 0; } },
          { label: "1–2 days", test: function(s){ return s >= 1 && s <= 2; } },
          { label: "3–6 days", test: function(s){ return s >= 3 && s <= 6; } },
          { label: "7–13 days", test: function(s){ return s >= 7 && s <= 13; } },
          { label: "14–29 days", test: function(s){ return s >= 14 && s <= 29; } },
          { label: "30+ days", test: function(s){ return s >= 30; } }
        ];
        var allStreaks = dailytasks.map(function(t){ return t.streak || 0; });
        var bucketCounts = buckets.map(function(b){
          return allStreaks.filter(b.test).length;
        });
        var streakChartEl = document.getElementById("streak-chart");
        streakChartEl.innerHTML = "";
        if(dailytasks.length === 0){
          streakChartEl.innerHTML = '<p class="empty">No daily-task activity yet.</p>';
        }else{
          var streakMax = Math.max(1, Math.max.apply(null, bucketCounts));
          buckets.forEach(function(b, idx){
            streakChartEl.appendChild(barRow(b.label, bucketCounts[idx], streakMax, "var(--accent)"));
          });
        }

        // ---- Lore submissions by status ----
        var loreChartEl = document.getElementById("lore-chart");
        loreChartEl.innerHTML = "";
        if(submissions.length === 0){
          loreChartEl.innerHTML = '<p class="empty">No lore submitted yet.</p>';
        }else{
          var statusCounts = { pending:0, approved:0, rejected:0 };
          submissions.forEach(function(s){
            if(s.status && statusCounts.hasOwnProperty(s.status)) statusCounts[s.status] += 1;
          });
          var loreMax = Math.max(1, statusCounts.pending, statusCounts.approved, statusCounts.rejected);
          loreChartEl.appendChild(barRow("Pending", statusCounts.pending, loreMax, "var(--warn)"));
          loreChartEl.appendChild(barRow("Approved", statusCounts.approved, loreMax, "var(--ok)"));
          loreChartEl.appendChild(barRow("Rejected", statusCounts.rejected, loreMax, "var(--bad)"));
        }
      }
    }

    if(window.doorsAuth){ ready(); }
    else{ window.addEventListener("doorsFirebaseReady", ready, { once:true }); }
  </script>
</body>
</html>
